services:
  - type: web
    name: ho-tro-hoc-sinh
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
      - key: ENABLE_SOCKETIO
        value: "1"
      - key: IMPORT_CURRENT_DATA
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.4
